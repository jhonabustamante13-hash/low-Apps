name: Extraer ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'Flow-Apps.zip'
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer y guardar
        run: |
          unzip -o Flow-Apps.zip
          rm Flow-Apps.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Añadir código de Flow-Apps"
          git push
