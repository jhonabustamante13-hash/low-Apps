name: Extraer ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Flow-Apps.zip
      - run: rm Flow-Apps.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extraer ZIP"
          git push
