name: Extraer ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -d Flow-Apps ]; then
            cp -a Flow-Apps/. .
            rm -rf Flow-Apps
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Subir carpetas" || true
          git push
